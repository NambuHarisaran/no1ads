<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Page title, description, canonical and og:/twitter: title/desc/url/image
      are injected per route by src/components/Seo.jsx (vite-react-ssg Head),
      so every prerendered page carries exactly one of each. Only site-wide
      constants live below.
    -->
    <meta name="keywords" content="advertising agency Madurai, branding Madurai, LED signage Tamil Nadu, ACP elevation, signage boards, exhibition stalls, roadshow branding, outdoor advertising, in-shop branding, Number One Ads" />
    <meta name="author" content="Number One Ads" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#E87722" />

    <!-- Geo targeting (Madurai, Tamil Nadu) -->
    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Madurai" />
    <meta name="geo.position" content="9.9252;78.1198" />
    <meta name="ICBM" content="9.9252, 78.1198" />

    <!-- Open Graph (site-wide constants; title/desc/url/image are per-page) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Number One Ads" />
    <meta property="og:image" content="https://no1ads.in/assets/logo.png" />
    <meta property="og:image:alt" content="Number One Ads logo" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter (site-wide constants) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://no1ads.in/assets/logo.png" />

    <link rel="icon" type="image/png" href="/assets/25.png" />
    <link rel="apple-touch-icon" href="/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,900;1,900&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

    <!--
      Structured data (LocalBusiness + WebSite + FAQPage) is injected here at
      build time from src/data/siteConfig.js and src/data/faqs.js via the
      transformIndexHtml hook in vite.config.js, so business NAP details live
      in one place and appear on every prerendered page. Placeholder below:
    -->
    <!--__JSONLD__-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
